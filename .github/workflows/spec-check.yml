name: Spec Check (nightly)

# Nightly spec-check station (spec-check roadmap M4, vostd first site).
# Runs the same entry script a local run uses —
# spec-check: examples/ci/run-spec-check.sh — inside the vostd nix
# devshell: build cargo-spec-check, capture the vostd contract surface,
# run the registered analyses, upload the reports.
#
# By contract (ANALYSIS-CONTRACT v1) findings never fail the run: the
# check command exits non-zero only on pipeline errors (config, capture,
# tool, unknown analysis).

on:
  push:
    branches:
      - experiment/high-level-spec-checker
  schedule:
    # Nightly. Adjust the time when the station goes live.
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      spec-check-repo:
        description: >-
          spec-check repository (owner/name). PLACEHOLDER until the
          spec-check repo has a remote — replace the default below.
        required: false
        default: "jetjinser/spec-check"
      spec-check-ref:
        description: "spec-check ref to check out (branch, tag, or rev)"
        required: false
        default: "0953178502c593374e94fc9fe787f98ada8c3c77"

permissions:
  contents: read

concurrency:
  group: spec-check-${{ github.event.schedule || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  spec-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      VOSTD_DIR: ${{ github.workspace }}
      SPEC_CHECK_DIR: ${{ github.workspace }}/spec-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: false

      - name: Prepare dv submodule (public main)
        run: |
          rm -rf dv
          git clone --depth 1 https://github.com/asterinas/rust-deductive-verifier.git dv
          git -C dv log --oneline -1

      - name: Set up toolchain and caches
        uses: ./.github/actions/setup-verus
        with:
          verus: 'false'
          install-verusfmt: 'false'

      - name: Cache pinned Verus
        uses: actions/cache@v6
        with:
          path: |
            tools/verus
            !tools/verus/.git
            !tools/verus/.git/**
            !tools/verus/source/target
            !tools/verus/source/target/**
          key: ${{ runner.os }}-verus-pinned-d128dda

      - name: Bootstrap pinned Verus
        run: |
          PIN=d128dda371ca4b19faa8b9b6e31425891ca9eadf
          if [[ -x tools/verus/source/target-verus/release/cargo-verus && -f tools/verus/source/z3 ]]; then
            echo "Using cached pinned Verus"
            exit 0
          fi
          rm -rf tools/verus
          git init -q tools/verus
          git -C tools/verus remote add origin https://github.com/asterinas/verus.git
          git -C tools/verus fetch --depth 1 origin "$PIN"
          git -C tools/verus checkout -q FETCH_HEAD
          cargo dv bootstrap

      - name: Checkout spec-check
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs['spec-check-repo'] || 'jetjinser/spec-check' }}
          ref: ${{ inputs['spec-check-ref'] || '0953178502c593374e94fc9fe787f98ada8c3c77' }}
          path: spec-check

      - name: Prepare output directory
        run: |
          CHECK_OUT="$RUNNER_TEMP/spec-check-report"
          mkdir -p "$CHECK_OUT"
          echo "CHECK_OUT=$CHECK_OUT" >> "$GITHUB_ENV"
          echo "artifact dir: $CHECK_OUT"

      - name: Install Rust toolchain and target
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustc-dev,llvm-tools,rust-src
          rustup target add x86_64-unknown-none --toolchain 1.98.1
          rustup default 1.98.1
          rustc -Vv
          rustup target list --installed

      - name: Run spec-check
        env:
          SPEC_CHECK_NO_NIX: '1'
        run: |
          echo "vostd: $VOSTD_DIR"
          echo "spec-check: $SPEC_CHECK_DIR ($(git -C "$SPEC_CHECK_DIR" rev-parse HEAD))"
          echo "artifact dir: $CHECK_OUT"
          set +e
          set -o pipefail
          status=1
          for attempt in 1 2; do
            "$SPEC_CHECK_DIR/examples/ci/run-spec-check.sh" 2>&1 | tee /tmp/spec-check-run.log
            status=${PIPESTATUS[0]}
            [[ $status -eq 0 ]] && break
            echo "::warning::run-spec-check attempt $attempt exited $status"
            sleep 10
          done
          if [[ $status -ne 0 ]]; then
            echo "::error::run-spec-check exited $status"
            if [[ -f "$CHECK_OUT/capture/report.json" ]]; then
              python3 - "$CHECK_OUT/capture/report.json" <<'PY' | sed 's/^/::error::/' | head -5 || true
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("capture status:", d.get("status"))
          for p in d.get("profiles", []):
              print("profile", p.get("profile"), "build_success", p.get("build_success"))
              for u in p.get("units", []):
                  if u.get("error"):
                      print("unit error:", str(u["error"])[:500])
          PY
            fi
            echo "::error::rustc: $(rustc -V 2>&1 || true)"
            echo "::error::cargo-verus: $(ls -l "$VOSTD_DIR/tools/verus/source/target-verus/release/cargo-verus" 2>&1 || true)"
            tail -n 10 /tmp/spec-check-run.log | sed 's/^/::error::/'
            exit $status
          fi

      - name: Publish summary
        if: always()
        run: |
          if [[ -f "$CHECK_OUT/check/report.json" ]]; then
            python3 - "$CHECK_OUT/check/report.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys

          report = json.load(open(sys.argv[1]))
          capture = report["capture"]
          summary = report["summary"]
          print("## Spec check (nightly)")
          print()
          print(f"- spec-check CONFIG: `{report['project_config']}`")
          stale = capture["recaptured_stale_reason"]
          capture_state = "reused fresh capture" if capture["reused"] else "ran project-capture"
          if stale:
              capture_state += f" (stale: {stale})"
          print(f"- capture: {capture_state}")
          print(f"- analyses: {summary['analyses']}")
          verdicts = summary["verdicts"]
          if verdicts:
              totals = ", ".join(f"{name}={count}" for name, count in verdicts.items())
              print(f"- verdict totals: {totals}")
          else:
              print("- verdict totals: none")
          print("- report artifact: `spec-check-report`")
          PY
          else
            {
              echo "## Spec check (nightly)"
              echo
              echo "- ❌ no report.json produced; see the run log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-check-report
          path: ${{ runner.temp }}/spec-check-report/
          retention-days: 7
          if-no-files-found: warn
