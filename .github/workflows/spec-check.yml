name: Spec Check (nightly)

# Nightly spec-check station: checks the current upstream vostd tree with
# spec-check, using the project's own toolchain and a Verus build cached by
# toolchain version.  This is the "current project quality" station, not a
# frozen research snapshot.
#
# The same entry script runs locally and in CI:
#   spec-check/examples/ci/run-spec-check.sh
#
# Findings never fail the run (ANALYSIS-CONTRACT v1); the check exits non-zero
# only on pipeline errors (config, capture, tool, unknown analysis).

on:
  push:
    branches:
      - experiment/high-level-spec-checker
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      vostd-repository:
        description: "vostd repository to check (owner/name)"
        required: false
        default: "asterinas/vostd"
      vostd-ref:
        description: "vostd ref to check"
        required: false
        default: "main"
      spec-check-repo:
        description: "spec-check repository (owner/name)"
        required: false
        default: "jetjinser/spec-check"
      spec-check-ref:
        description: "spec-check ref to check out"
        required: false
        default: "master"

permissions:
  contents: read

concurrency:
  group: spec-check-${{ github.event.schedule || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  spec-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      VOSTD_DIR: ${{ github.workspace }}
      SPEC_CHECK_DIR: ${{ github.workspace }}/spec-check
    steps:
      - name: Checkout vostd
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs['vostd-repository'] || 'asterinas/vostd' }}
          ref: ${{ inputs['vostd-ref'] || 'main' }}
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential unzip pkg-config libssl-dev llvm

      - name: Install project toolchain and target
        id: rust
        run: |
          RUST_VERSION=$(sed -nE 's/^channel = "([^"]+)"/\1/p' rust-toolchain.toml | head -1)
          echo "version=$RUST_VERSION" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --component rustc-dev,llvm-tools,rust-src
          rustup target add x86_64-unknown-none --toolchain "$RUST_VERSION"
          rustup default "$RUST_VERSION"
          rustc -Vv

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Verus
        uses: actions/cache@v6
        with:
          path: |
            tools/verus
            !tools/verus/.git
            !tools/verus/.git/**
            !tools/verus/source/target
            !tools/verus/source/target/**
          key: ${{ runner.os }}-verus-${{ steps.rust.outputs.version }}-v2

      - name: Bootstrap Verus (if missing or stale)
        run: |
          VERUS_BIN=tools/verus/source/target-verus/release/verus
          if [[ -x "$VERUS_BIN" ]] && "$VERUS_BIN" --version >/dev/null 2>&1; then
            echo "Using cached Verus"
          else
            echo "Verus missing or stale; bootstrapping with $RUST_VERSION"
            rm -rf tools/verus
            cargo dv bootstrap
            "$VERUS_BIN" --version
          fi

      - name: Ensure rustc shared libraries
        run: |
          for tc in $(rustup toolchain list | awk '{print $1}'); do
            rustup component add rustc-dev llvm-tools rust-src --toolchain "$tc" >/dev/null 2>&1 || true
          done
          LIBS="$(find "$HOME/.rustup/toolchains" -maxdepth 3 -type d -name lib | paste -sd:)"
          echo "LD_LIBRARY_PATH=$LIBS${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "librustc_driver libraries found:"
          find "$HOME/.rustup/toolchains" -name 'librustc_driver-*.so' | head
          "$VOSTD_DIR/tools/verus/source/target-verus/release/verus" --version

      - name: Checkout spec-check
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs['spec-check-repo'] || 'jetjinser/spec-check' }}
          ref: ${{ inputs['spec-check-ref'] || 'master' }}
          path: spec-check

      - name: Prepare output directory
        run: |
          CHECK_OUT="$RUNNER_TEMP/spec-check-report"
          mkdir -p "$CHECK_OUT"
          echo "CHECK_OUT=$CHECK_OUT" >> "$GITHUB_ENV"
          echo "artifact dir: $CHECK_OUT"

      - name: Prepare smoke inputs
        run: |
          SMOKE="$CHECK_OUT/smoke"
          rm -rf "$SMOKE"
          mkdir -p "$SMOKE/crate"
          cp -r "$SPEC_CHECK_DIR/examples/check-smoke/crate/src" "$SMOKE/crate/src"
          cat > "$SMOKE/crate/Cargo.toml" <<EOF
          [package]
          name = "check-smoke-crate"
          version = "0.1.0"
          edition = "2021"
          publish = false

          [dependencies]
          vstd = { path = "$VOSTD_DIR/tools/verus/source/vstd" }

          [workspace]

          [package.metadata.verus]
          verify = true
          EOF
          cat > "$SMOKE/capture.json" <<'EOF'
          {"profiles":[{"name":"smoke-lib","package":"check-smoke-crate","target":"x86_64-unknown-linux-gnu","tests":false,"features":[],"default_features":true}]}
          EOF
          cp "$SPEC_CHECK_DIR/examples/check-smoke/manifest.json" "$SMOKE/manifest.json"
          {
            echo "CAPTURE_CONFIG=$SMOKE/capture.json"
            echo "CAPTURE_MANIFEST=$SMOKE/crate/Cargo.toml"
            echo "ANALYSIS_MANIFEST=$SMOKE/manifest.json"
          } >> "$GITHUB_ENV"

      - name: Run spec-check
        env:
          SPEC_CHECK_NO_NIX: '1'
        run: |
          echo "vostd: $VOSTD_DIR"
          echo "spec-check: $SPEC_CHECK_DIR ($(git -C "$SPEC_CHECK_DIR" rev-parse HEAD))"
          echo "artifact dir: $CHECK_OUT"
          set +e
          set -o pipefail
          status=1
          for attempt in 1 2; do
            "$SPEC_CHECK_DIR/examples/ci/run-spec-check.sh" 2>&1 | tee /tmp/spec-check-run.log
            status=${PIPESTATUS[0]}
            [[ $status -eq 0 ]] && break
            echo "::warning::run-spec-check attempt $attempt exited $status"
            sleep 10
          done
          if [[ $status -ne 0 ]]; then
            echo "::error::run-spec-check exited $status"
            if [[ -f "$CHECK_OUT/capture/report.json" ]]; then
              python3 - "$CHECK_OUT/capture/report.json" <<'PY' | sed 's/^/::error::/' | head -8 || true
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          print("capture status:", d.get("status"))
          for p in d.get("profiles", []):
              print("profile", p.get("profile"), "build_success", p.get("build_success"),
                    "kind", p.get("build_failure_kind"), "exit", p.get("build_exit_code"))
              obs = p.get("build_obstacles") or []
              for o in list(obs)[:4]:
                  print("obstacle:", str(o)[:240])
              for key in ("build_stdout", "evidence"):
                  path = p.get(key)
                  if not path or not os.path.exists(path):
                      continue
                  errs = [l.strip() for l in open(path, errors="replace")
                          if "error" in l.lower() or "cannot" in l.lower()]
                  for l in errs[:6]:
                      print(key, "line:", l[:300])
          PY
            fi
            echo "::error::rustc: $(rustc -V 2>&1 || true)"
            echo "::error::cargo-verus: $(ls -l "$VOSTD_DIR/tools/verus/source/target-verus/release/cargo-verus" 2>&1 || true)"
            tail -n 10 /tmp/spec-check-run.log | sed 's/^/::error::/'
            exit $status
          fi

      - name: Publish summary
        if: always()
        run: |
          if [[ -f "$CHECK_OUT/check/report.json" ]]; then
            python3 - "$CHECK_OUT/check/report.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys

          report = json.load(open(sys.argv[1]))
          capture = report["capture"]
          summary = report["summary"]
          print("## Spec check (nightly)")
          print()
          print(f"- spec-check CONFIG: `{report['project_config']}`")
          stale = capture["recaptured_stale_reason"]
          capture_state = "reused fresh capture" if capture["reused"] else "ran project-capture"
          if stale:
              capture_state += f" (stale: {stale})"
          print(f"- capture: {capture_state}")
          print(f"- analyses: {summary['analyses']}")
          verdicts = summary["verdicts"]
          if verdicts:
              totals = ", ".join(f"{name}={count}" for name, count in verdicts.items())
              print(f"- verdict totals: {totals}")
          else:
              print("- verdict totals: none")
          print("- report artifact: `spec-check-report`")
          PY
          else
            {
              echo "## Spec check (nightly)"
              echo
              echo "- ❌ no report.json produced; see the run log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spec-check-report
          path: ${{ runner.temp }}/spec-check-report/
          retention-days: 7
          if-no-files-found: warn
